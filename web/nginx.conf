server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API keeps its own paths; uploads can be up to 32 MiB, so nginx must
    # allow a body larger than its default 1 MB.
    client_max_body_size 32m;

    # Behind a reverse proxy (the `caddy` service, or one on the host) every
    # request arrives from the proxy's address, so the API's per-address login
    # limit would count all visitors as one and a few failed logins would lock
    # everyone out (#398). Take the client address from X-Forwarded-For, but only
    # when the request comes from a private or loopback address -- the compose
    # network, the Docker host, a proxy on the LAN. A client reaching :5173
    # directly from the internet has a public address, so it cannot forge it.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Static assets get a long cache: the build emits content-hashed names.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The OpenAPI reference belongs to the API, not the SPA. Proxy /docs and its
    # assets (/docs/swagger-ui.css, /docs/*.js) so the reference is reachable on
    # the UI origin too, not only on the API port.
    location /docs {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-asset route serves index.html for the browser
    # router. Files that exist (favicon, logo, etc.) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
